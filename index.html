<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebP Watermarker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .checkered-bg {
            background-image: linear-gradient(45deg, #18191a 25%, transparent 25%), linear-gradient(-45deg, #18191a 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #18191a 75%), linear-gradient(-45deg, transparent 75%, #18191a 75%);
            background-size: 24px 24px;
            background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
            background-color: #242526;
        }
        :root { --navbar-h: 56px; }
        body { overflow: hidden; }
        .main-scroll {
            height: calc(100vh - var(--navbar-h));
            overflow-y: auto;
        }
        @media (min-width: 992px) {
            .sticky-panel {
                position: sticky;
                top: 1.5rem;
                max-height: calc(100vh - var(--navbar-h) - 3rem);
                overflow-y: auto;
            }
        }
        .sticky-panel::-webkit-scrollbar { width: 4px; }
        .sticky-panel::-webkit-scrollbar-track { background: transparent; }
        .sticky-panel::-webkit-scrollbar-thumb { background: #495057; border-radius: 2px; }
        .fit-canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .navbar-brand span.badge-pill {
            font-size: 0.6rem;
            letter-spacing: 0.08em;
        }
        #clearBtn:hover { background-color: #dc3545 !important; color: #fff !important; }
        #clearBtn { transition: background-color 0.15s, color 0.15s; }
        .bg-amber { background-color: #d97706 !important; }
        .panel-card {
            background-color: #161b22 !important;
            border-color: #344154 !important;
        }
        .panel-header {
            background-color: #1f2937 !important;
            border-bottom: 1px solid #344154 !important;
        }
        .panel-footer {
            background-color: #1f2937 !important;
            border-top: 1px solid #344154 !important;
        }
        #censorOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            pointer-events: none;
            z-index: 5;
        }
        #censorOverlay.draw-mode { pointer-events: auto; cursor: crosshair; user-select: none; }
        .censor-region {
            position: absolute;
            border: 2px solid #f59e0b;
            background: rgba(245, 158, 11, 0.15);
            pointer-events: auto;
            box-sizing: border-box;
        }
        .censor-region-active {
            border-style: dashed;
            background: rgba(245, 158, 11, 0.25);
            pointer-events: none;
        }
        .censor-region-del {
            position: absolute;
            top: -9px;
            right: -9px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #dc3545;
            color: #fff;
            border: 1px solid #1f2937;
            font-size: 12px;
            line-height: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .censor-region-del:hover { background: #b91c1c; }
    </style>
</head>
<body class="bg-dark text-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-black border-bottom border-secondary px-lg-5 px-3">
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <i class="bi bi-droplet-half text-info fs-5"></i>
            <span class="fw-bold text-light">WebP Watermarker</span>
        </a>
        <button id="clearBtn" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-2" title="Clear all saved config">
            <i class="bi bi-trash3"></i>
            <span class="d-none d-sm-inline">Clear saved config</span>
        </button>
    </nav>

    <div class="main-scroll"><div class="container-fluid px-lg-5 py-4">
        <div class="row g-4">
            
            <div class="col-12 col-xl-4 col-lg-5">
                <div class="card panel-card border-secondary shadow-sm h-100 d-flex flex-column sticky-panel">
                    <div class="card-header panel-header py-2">
                        <h6 class="card-title mb-0 text-info text-uppercase tracking-wider fw-bold small"><i class="bi bi-sliders me-2"></i>1. Setup Parameters</h6>
                    </div>
                    <div class="card-body flex-grow-1 py-2">
                        <div class="mb-2">
                            <label class="form-label text-light fw-semibold small mb-1 d-flex align-items-center gap-2">
                                Source Image(s) (Optional)
                                <span id="batchBadge" class="badge bg-info text-dark d-none" style="font-size:0.65rem;">BATCH</span>
                            </label>
                            <input type="file" id="imageLoader" accept="image/jpeg, image/png, image/webp, image/avif" multiple class="form-control bg-dark text-light border-secondary form-control-sm">
                        </div>
                        <div id="grayscaleBox" class="d-none row g-2 mb-2">
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1 d-block" for="grayscale">Convert to BW</label>
                                <div class="d-flex align-items-center gap-2" style="height: 31px;">
                                    <div class="form-check form-switch ps-0 m-0">
                                        <input type="checkbox" id="grayscale" class="form-check-input ms-0 mt-0" role="switch">
                                    </div>
                                    <label class="text-light small mb-0" for="grayscale">On</label>
                                </div>
                            </div>
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1" title="Resizes the source image before watermarking. 100 = original size.">Resize (%)</label>
                                <input type="number" id="resizePct" value="100" min="1" max="500" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                        </div>
                        <div id="censorBox" class="d-none border-top border-secondary pt-2 mb-2">
                            <div class="d-flex align-items-center justify-content-between mb-1">
                                <label class="form-label text-light fw-semibold small mb-0"><i class="bi bi-eye-slash me-1"></i>Censor Regions</label>
                                <span id="censorCount" class="badge bg-secondary" style="font-size:0.65rem;">0 region(s)</span>
                            </div>
                            <div class="row g-2 align-items-end">
                                <div class="col-3">
                                    <button id="censorDrawToggle" type="button" class="btn btn-sm btn-outline-warning w-100 fw-medium px-1">
                                        <i class="bi bi-pencil-square"></i> <span id="censorDrawToggleLabel">Draw</span>
                                    </button>
                                </div>
                                <div class="col-3">
                                    <button id="censorClearBtn" type="button" class="btn btn-sm btn-outline-secondary w-100 px-1" title="Clear regions on this image">
                                        <i class="bi bi-eraser"></i> Clear
                                    </button>
                                </div>
                                <div class="col-6">
                                    <label class="form-label text-light fw-semibold small d-flex justify-content-between mb-1">
                                        <span>Blur Strength</span>
                                        <span id="censorBlurVal" class="text-info fw-bold">15px</span>
                                    </label>
                                    <input type="range" id="censorBlur" min="2" max="50" value="15" class="form-range">
                                </div>
                            </div>
                        </div>
                        <div id="batchProgress" class="d-none mb-2">
                            <div class="progress" style="height:6px;">
                                <div id="batchProgressBar" class="progress-bar bg-info" role="progressbar" style="width:0%"></div>
                            </div>
                            <div id="batchProgressLabel" class="text-secondary small mt-1 text-center">0 / 0</div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label text-light fw-semibold small mb-1">Layout Mode</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="layoutMode" id="modeTiled" checked>
                                    <label class="btn btn-outline-info btn-sm w-50 fw-medium" for="modeTiled" title="Tiled Grid">Tiled</label>

                                    <input type="radio" class="btn-check" name="layoutMode" id="modeSingle">
                                    <label class="btn btn-outline-info btn-sm w-50 fw-medium" for="modeSingle" title="Single Asset">Single</label>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="form-label text-light fw-semibold small mb-1">Font Family</label>
                                <select id="fontFamily" class="form-select bg-dark text-light border-secondary form-select-sm">
                                    <option value="sans-serif">Sans-Serif</option>
                                    <option value="serif">Serif</option>
                                    <option value="monospace">Monospace</option>
                                    <option value="Impact">Impact</option>
                                </select>
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1">Size</label>
                                <input type="number" id="fontSize" value="30" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1">Opacity</label>
                                <input type="number" id="opacity" value="0.5" step="0.1" min="0" max="1" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1">Color</label>
                                <input type="color" id="color" value="#c0c0c0" class="form-control form-control-color bg-dark border-secondary w-100 p-1 form-control-sm" style="height: 31px;">
                            </div>
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1">Rotate</label>
                                <input type="number" id="rotation" value="-45" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                        </div>

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="form-label text-light fw-semibold small mb-1">Text Phrase</label>
                                <input type="text" id="text" value="COPY" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                            <div id="autoFitGapBox" class="d-none col-3">
                                <label class="form-label text-light fw-semibold small mb-1 d-block" for="autoFitGap">Auto-fit Gap</label>
                                <div class="d-flex align-items-center gap-2" style="height: 31px;">
                                    <div class="form-check form-switch ps-0 m-0">
                                        <input type="checkbox" id="autoFitGap" class="form-check-input ms-0 mt-0" checked role="switch">
                                    </div>
                                    <label class="text-light small mb-0" for="autoFitGap" title="Prevents tile overlap by growing the gap to fit the text">On</label>
                                </div>
                            </div>
                            <div class="col-3">
                                <label class="form-label text-light fw-semibold small mb-1" title="Wraps text onto multiple lines at this width. 0 = no wrap.">Wrap At (px)</label>
                                <input type="number" id="wrapWidth" value="200" min="0" class="form-control bg-dark text-light border-secondary form-control-sm">
                            </div>
                        </div>

                        <div id="dimensionsControls" class="d-none border-top border-secondary pt-2 mt-1">
                            <div class="row g-2">
                                <div id="gapXBox" class="col-3">
                                    <label class="form-label text-light fw-semibold small mb-1">Gap X</label>
                                    <input type="number" id="gapX" value="150" class="form-control bg-dark text-light border-secondary form-control-sm">
                                </div>
                                <div id="gapYBox" class="col-3">
                                    <label class="form-label text-light fw-semibold small mb-1">Gap Y</label>
                                    <input type="number" id="gapY" value="150" class="form-control bg-dark text-light border-secondary form-control-sm">
                                </div>
                                <div id="widthBox" class="col-3">
                                    <label class="form-label text-light fw-semibold small mb-1">Width</label>
                                    <input type="number" id="gridWidth" value="1200" class="form-control bg-dark text-light border-secondary form-control-sm">
                                </div>
                                <div id="heightBox" class="col-3">
                                    <label class="form-label text-light fw-semibold small mb-1">Height</label>
                                    <input type="number" id="gridHeight" value="1600" class="form-control bg-dark text-light border-secondary form-control-sm">
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 border-top border-secondary pt-2 mt-1">
                            <div id="formatCol" class="col-6">
                                <label class="form-label text-light fw-semibold small mb-1">Output Format</label>
                                <select id="outputFormat" class="form-select bg-dark text-light border-secondary form-select-sm">
                                    <option value="image/webp">WebP</option>
                                    <option value="image/png">PNG</option>
                                    <option value="image/jpeg">JPG</option>
                                    <option value="image/avif">AVIF</option>
                                    <option value="application/pdf">PDF</option>
                                </select>
                            </div>
                            <div id="qualitySettings" class="d-none col-6">
                                <label class="form-label text-light fw-semibold small d-flex justify-content-between mb-1">
                                    <span id="qualityLabel">Quality</span>
                                    <span id="qualityVal" class="text-info fw-bold">85%</span>
                                </label>
                                <input type="range" id="webpQuality" min="1" max="100" value="85" class="form-range mt-2">
                            </div>
                        </div>
                        <div id="formatHint" class="form-text text-secondary mt-1" style="font-size:0.7rem;"></div>
                    </div>
                    <div class="card-footer panel-footer p-2">
                        <button id="downloadBtn" class="btn btn-info btn-sm w-100 fw-bold py-2 shadow-sm text-uppercase tracking-wide"><i class="bi bi-download me-2"></i>Compile &amp; Export</button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-xl-8 col-lg-7">
                <div class="card panel-card border-secondary shadow-sm d-flex flex-column" style="height: calc(100vh - var(--navbar-h) - 3rem);">
                    <div class="card-header panel-header py-3 d-flex align-items-center justify-content-between flex-wrap gap-2">
                        <div class="d-flex flex-column">
                            <h6 class="card-title mb-0 text-info text-uppercase tracking-wider fw-bold small"><i class="bi bi-eye me-2"></i>2. Preview</h6>
                            <div id="previewImageInfo" class="d-none align-items-center gap-2 mt-1">
                                <span id="previewImageFormatBadge" class="badge" style="font-size:0.75rem;"></span>
                                <span id="previewImageInfoText" class="text-light fw-medium" style="font-size:0.85rem;"></span>
                            </div>
                        </div>
                        <div class="d-flex align-items-center gap-2">
                            <div id="previewNav" class="d-none align-items-center gap-2">
                                <button id="prevBtn" class="btn btn-sm btn-outline-info px-2 py-0" title="Previous image"><i class="bi bi-chevron-left"></i></button>
                                <span id="previewIndex" class="text-light fw-medium" style="min-width:3rem;text-align:center;font-size:0.85rem;">1 / 1</span>
                                <button id="nextBtn" class="btn btn-sm btn-outline-info px-2 py-0" title="Next image"><i class="bi bi-chevron-right"></i></button>
                            </div>
                            <button id="downloadCurrentBtn" class="btn btn-sm btn-success px-2 py-1 d-none align-items-center gap-1" title="Download currently previewed image">
                                <i class="bi bi-download"></i>
                                <span class="d-none d-sm-inline">Download current</span>
                            </button>
                        </div>
                    </div>
                    <div class="card-body p-3 flex-grow-1 bg-black d-flex align-items-center justify-content-center overflow-hidden">
                        <div class="checkered-bg shadow-lg rounded p-1 w-100 h-100 d-flex align-items-center justify-content-center position-relative" id="canvasWrap">
                            <canvas id="watermarkCanvas" class="fit-canvas shadow"></canvas>
                            <div id="censorOverlay"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
    </div><!-- /main-scroll -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

    <script>
        const STORAGE_KEY = 'wmw_config';

        const DEFAULTS = {
            text: 'COPY',
            fontSize: '30',
            opacity: '0.5',
            color: '#c0c0c0',
            rotation: '-45',
            fontFamily: 'sans-serif',
            gridWidth: '1200',
            gridHeight: '1600',
            gapX: '150',
            gapY: '150',
            webpQuality: '85',
            layoutMode: 'tiled',
            outputFormat: 'image/webp',
            autoFitGap: true,
            wrapWidth: '200',
            grayscale: false,
            resizePct: '100',
            censorBlur: '15'
        };

        const FORMAT_EXT = {
            'image/webp': 'webp',
            'image/png': 'png',
            'image/jpeg': 'jpg',
            'image/avif': 'avif',
            'application/pdf': 'pdf'
        };

        // Formats that make sense with no source image (pure text/tile watermark).
        // JPG has no alpha channel so a transparent watermark would get a baked-in
        // black background - we exclude it from this list.
        const NO_IMAGE_FORMATS = ['image/webp', 'image/png', 'image/avif', 'application/pdf'];

        let avifSupported = null; // cached after first feature-detect
        function checkAvifSupport() {
            if (avifSupported !== null) return Promise.resolve(avifSupported);
            return new Promise((resolve) => {
                const probe = document.createElement('canvas');
                // Use a small but non-degenerate size - some encoders behave
                // oddly on 1x1 inputs.
                probe.width = 2;
                probe.height = 2;
                const pctx = probe.getContext('2d');
                pctx.fillStyle = '#888';
                pctx.fillRect(0, 0, 2, 2);
                probe.toBlob((blob) => {
                    avifSupported = !!(blob && blob.type === 'image/avif');
                    console.log('[AVIF check] toBlob returned type:', blob && blob.type, '-> avifSupported =', avifSupported);
                    resolve(avifSupported);
                }, 'image/avif');
                // Some browsers never call back for unsupported types
                setTimeout(() => {
                    if (avifSupported === null) {
                        avifSupported = false;
                        console.log('[AVIF check] toBlob callback never fired within 300ms -> avifSupported = false');
                        resolve(false);
                    }
                }, 300);
            });
        }

        const canvas = document.getElementById('watermarkCanvas');
        const ctx = canvas.getContext('2d');

        let currentMode = 'tiled';
        let uploadedImage = null;
        let uploadedImageName = '';
        let uploadedFile = null;

        const modeSingleRadio = document.getElementById('modeSingle');
        const modeTiledRadio = document.getElementById('modeTiled');
        const dimensionsControls = document.getElementById('dimensionsControls');
        const widthBox = document.getElementById('widthBox');
        const heightBox = document.getElementById('heightBox');
        const gapXBox = document.getElementById('gapXBox');
        const gapYBox = document.getElementById('gapYBox');
        const autoFitGapBox = document.getElementById('autoFitGapBox');
        const autoFitGap = document.getElementById('autoFitGap');
        const imageLoader = document.getElementById('imageLoader');
        const grayscaleBox = document.getElementById('grayscaleBox');
        const grayscale = document.getElementById('grayscale');
        const qualitySettings = document.getElementById('qualitySettings');
        const webpQuality = document.getElementById('webpQuality');
        const qualityVal = document.getElementById('qualityVal');
        const qualityLabel = document.getElementById('qualityLabel');
        const outputFormat = document.getElementById('outputFormat');
        const formatHint = document.getElementById('formatHint');
        const previewImageInfo = document.getElementById('previewImageInfo');
        const previewImageFormatBadge = document.getElementById('previewImageFormatBadge');
        const previewImageInfoText = document.getElementById('previewImageInfoText');
        const downloadCurrentBtn = document.getElementById('downloadCurrentBtn');

        // --- Censor regions ---
        const canvasWrap = document.getElementById('canvasWrap');
        const censorOverlay = document.getElementById('censorOverlay');
        const censorBox = document.getElementById('censorBox');
        const censorDrawToggle = document.getElementById('censorDrawToggle');
        const censorDrawToggleLabel = document.getElementById('censorDrawToggleLabel');
        const censorClearBtn = document.getElementById('censorClearBtn');
        const censorBlur = document.getElementById('censorBlur');
        const censorBlurVal = document.getElementById('censorBlurVal');
        const censorCount = document.getElementById('censorCount');

        let censorRegions = [];    // array of arrays of {x,y,w,h} fractions (0-1), indexed per image
        let censorDrawMode = false;
        let isDraggingCensor = false;
        let censorDragStart = null;
        let censorDragCurrent = null;

        const inputs = ['text', 'fontSize', 'opacity', 'color', 'rotation', 'fontFamily', 'gridWidth', 'gridHeight', 'gapX', 'gapY', 'wrapWidth', 'resizePct'].reduce((acc, id) => {
            acc[id] = document.getElementById(id);
            return acc;
        }, {});

        // --- Persistence ---
        function saveConfig() {
            const cfg = {};
            Object.entries(inputs).forEach(([k, el]) => cfg[k] = el.value);
            cfg.webpQuality = webpQuality.value;
            cfg.layoutMode = currentMode;
            cfg.outputFormat = outputFormat.value;
            cfg.autoFitGap = autoFitGap.checked;
            cfg.grayscale = grayscale.checked;
            cfg.censorBlur = censorBlur.value;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg)); } catch(e) {}
        }

        function loadConfig() {
            let cfg = DEFAULTS;
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) cfg = { ...DEFAULTS, ...JSON.parse(stored) };
            } catch(e) {}

            Object.entries(inputs).forEach(([k, el]) => {
                if (cfg[k] !== undefined) el.value = cfg[k];
            });
            webpQuality.value = cfg.webpQuality;
            qualityVal.textContent = `${cfg.webpQuality}%`;
            outputFormat.value = cfg.outputFormat || DEFAULTS.outputFormat;
            autoFitGap.checked = cfg.autoFitGap !== undefined ? cfg.autoFitGap : DEFAULTS.autoFitGap;
            grayscale.checked = cfg.grayscale !== undefined ? cfg.grayscale : DEFAULTS.grayscale;
            censorBlur.value = cfg.censorBlur || DEFAULTS.censorBlur;
            censorBlurVal.textContent = `${censorBlur.value}px`;

            currentMode = cfg.layoutMode || 'tiled';
            if (currentMode === 'tiled') {
                modeTiledRadio.checked = true;
            } else {
                modeSingleRadio.checked = true;
            }
            updateFormatUI();
        }

        function clearConfig() {
            try { localStorage.removeItem(STORAGE_KEY); } catch(e) {}
            Object.entries(DEFAULTS).forEach(([k, v]) => {
                if (inputs[k]) inputs[k].value = v;
            });
            webpQuality.value = DEFAULTS.webpQuality;
            qualityVal.textContent = `${DEFAULTS.webpQuality}%`;
            outputFormat.value = DEFAULTS.outputFormat;
            autoFitGap.checked = DEFAULTS.autoFitGap;
            grayscale.checked = DEFAULTS.grayscale;
            censorBlur.value = DEFAULTS.censorBlur;
            censorBlurVal.textContent = `${DEFAULTS.censorBlur}px`;
            currentMode = DEFAULTS.layoutMode;
            modeTiledRadio.checked = true;
            modeSingleRadio.checked = false;
            uploadedImage = null;
            uploadedImageName = '';
            uploadedFile = null;
            batchFiles = [];
            previewIdx = 0;
            resetCensorRegions(0);
            setCensorDrawMode(false);
            imageLoader.value = '';
            updatePreviewNav();
            toggleControlsVisibility();
            updateFormatUI();
            updateWatermark();
        }

        // --- Event listeners ---
        webpQuality.addEventListener('input', (e) => {
            qualityVal.textContent = `${e.target.value}%`;
            saveConfig();
        });

        outputFormat.addEventListener('change', () => {
            saveConfig();
            updateFormatUI();
        });

        function updateFormatUI() {
            const hasImage = !!uploadedImage;
            const fmt = outputFormat.value;
            const avifOption = outputFormat.querySelector('option[value="image/avif"]');

            // Disable formats that don't make sense without a source image (JPG, no alpha).
            Array.from(outputFormat.options).forEach(opt => {
                const disable = !hasImage && !NO_IMAGE_FORMATS.includes(opt.value);
                opt.disabled = disable;
            });

            // AVIF encoding via canvas is not implemented in any browser today
            // (Chrome/Firefox/Safari can decode AVIF, but toBlob/toDataURL silently
            // falls back to PNG when asked for image/avif). Disable it outright
            // once we've confirmed that, instead of letting people export a
            // mislabeled file.
            if (avifSupported === false && avifOption) {
                avifOption.disabled = true;
                avifOption.textContent = 'AVIF (unsupported)';
            }
            if (avifSupported === null) {
                checkAvifSupport().then(ok => {
                    if (!ok && avifOption) {
                        avifOption.disabled = true;
                        avifOption.textContent = 'AVIF (unsupported)';
                        if (outputFormat.value === 'image/avif') {
                            outputFormat.value = 'image/webp';
                            saveConfig();
                            updateFormatUI();
                        }
                    }
                });
            }

            // If the current selection just became invalid, fall back to WebP.
            if ((!hasImage && !NO_IMAGE_FORMATS.includes(fmt)) || (fmt === 'image/avif' && avifSupported === false)) {
                outputFormat.value = 'image/webp';
                saveConfig();

            const selected = outputFormat.value;
            const isLossy = selected === 'image/webp' || selected === 'image/jpeg' || selected === 'image/avif';

            if (selected === 'image/jpeg') qualityLabel.textContent = 'JPG Render Quality';

            let hint = '';
            if (selected === 'image/jpeg' && !hasImage) {
                hint = 'JPG requires a source image (no transparency support).';
            } else if (selected === 'image/png') {
                hint = 'PNG is lossless - the quality slider does not apply.';

                hint = 'Exports a single-page PDF sized to the watermarked image.';
            } else if (selected === 'image/avif') {

            const label = isBatch ? 'Watermark All &amp; Download ZIP' : 'Compile &amp; Export';
            dlBtn.innerHTML = `<i class="bi ${isBatch ? 'bi-file-zip' : 'bi-download'} me-2"></i>${label}`;

        // --- Censor regions: state, drawing, and rendering ---

        function resetCensorRegions(count) {
            censorRegions = Array.from({ length: Math.max(count, 0) }, () => []);
        }

        function getCurrentRegionIndex() {
            return batchFiles.length > 1 ? previewIdx : 0;
        }

        function getCurrentRegions() {
            const idx = getCurrentRegionIndex();
            if (!censorRegions[idx]) censorRegions[idx] = [];
            return censorRegions[idx];
        }

        function setCensorDrawMode(on) {
            censorDrawMode = on;
            censorDrawToggle.classList.toggle('btn-warning', censorDrawMode);
            censorDrawToggle.classList.toggle('btn-outline-warning', !censorDrawMode);
            censorDrawToggleLabel.textContent = censorDrawMode ? 'Drawing…' : 'Draw';
            censorOverlay.classList.toggle('draw-mode', censorDrawMode);

        // Applies a Gaussian-style blur to one or more rectangular regions of
        // an already-drawn canvas. Re-draws the full source image clipped to
        // each region with a CSS blur filter, so the blur samples real pixels
        // from just outside the rectangle (no dark/transparent edge halo).
        function applyCensorRegions(context, img, canvasW, canvasH, regions, blurPx, grayscaleOn) {
            if (!regions || regions.length === 0 || !blurPx || blurPx <= 0) return;
            regions.forEach(r => {
                const rx = r.x * canvasW;
                const ry = r.y * canvasH;
                const rw = r.w * canvasW;
                const rh = r.h * canvasH;
                if (rw <= 0 || rh <= 0) return;
                context.save();
                context.beginPath();
                context.rect(rx, ry, rw, rh);
                context.clip();
                context.filter = grayscaleOn ? `grayscale(100%) blur(${blurPx}px)` : `blur(${blurPx}px)`;
                context.drawImage(img, 0, 0, canvasW, canvasH);
                context.filter = 'none';
                context.restore();
            });
        }

        // Keeps the (invisible) overlay div's box pixel-aligned with the
        // actual rendered canvas box, which can be smaller than its flex
        // container due to the image's aspect ratio.
        function syncCensorOverlay() {
            if (!uploadedImage) {
                censorOverlay.style.width = '0px';
                censorOverlay.style.height = '0px';
                return;
            }
            const wrapRect = canvasWrap.getBoundingClientRect();
            const canvasRect = canvas.getBoundingClientRect();
            censorOverlay.style.left = (canvasRect.left - wrapRect.left) + 'px';
            censorOverlay.style.top = (canvasRect.top - wrapRect.top) + 'px';
            censorOverlay.style.width = canvasRect.width + 'px';
            censorOverlay.style.height = canvasRect.height + 'px';
        }

        function updateCensorCount() {
            const n = getCurrentRegions().length;
            censorCount.textContent = `${n} region${n === 1 ? '' : 's'}`;
        }

        // Redraws the rectangle markers (and delete buttons) for the
        // currently-previewed image, plus the in-progress drag rectangle.
        function renderCensorOverlay() {
            censorOverlay.innerHTML = '';
            const regions = getCurrentRegions();
            regions.forEach((r, i) => {
                const div = document.createElement('div');
                div.className = 'censor-region';
                div.style.left = (r.x * 100) + '%';
                div.style.top = (r.y * 100) + '%';
                div.style.width = (r.w * 100) + '%';
                div.style.height = (r.h * 100) + '%';
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'censor-region-del';
                del.title = 'Remove region';
                del.innerHTML = '<i class="bi bi-x"></i>';
                del.addEventListener('mousedown', (e) => e.stopPropagation());
                del.addEventListener('click', (e) => {
                    e.stopPropagation();
                    regions.splice(i, 1);
                    updateWatermark();
                });
                div.appendChild(del);
                censorOverlay.appendChild(div);
            });
            if (isDraggingCensor && censorDragStart && censorDragCurrent) {
                const rx = Math.min(censorDragStart.x, censorDragCurrent.x);
                const ry = Math.min(censorDragStart.y, censorDragCurrent.y);
                const rw = Math.abs(censorDragCurrent.x - censorDragStart.x);
                const rh = Math.abs(censorDragCurrent.y - censorDragStart.y);
                const div = document.createElement('div');
                div.className = 'censor-region censor-region-active';
                div.style.left = (rx * 100) + '%';
                div.style.top = (ry * 100) + '%';
                div.style.width = (rw * 100) + '%';
                div.style.height = (rh * 100) + '%';
                censorOverlay.appendChild(div);
            }
            updateCensorCount();
        }

        censorDrawToggle.addEventListener('click', () => setCensorDrawMode(!censorDrawMode));

        censorClearBtn.addEventListener('click', () => {

        censorOverlay.addEventListener('mousedown', (e) => {
            if (e.target !== censorOverlay) return; // clicked an existing region/delete button
            if (!censorDrawMode || !uploadedImage) return;
            e.preventDefault();
            const rect = censorOverlay.getBoundingClientRect();
            const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            const y = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
            censorDragStart = { x, y };
            censorDragCurrent = { x, y };
            isDraggingCensor = true;
            renderCensorOverlay();

        window.addEventListener('mousemove', (e) => {

            const rect = censorOverlay.getBoundingClientRect();
            const x = Math.min(Math.max((e.clientX - rect.left) / rect.width, 0), 1);
            const y = Math.min(Math.max((e.clientY - rect.top) / rect.height, 0), 1);
            censorDragCurrent = { x, y };
            renderCensorOverlay();
        });

            isDraggingCensor = false;

                const rx = Math.min(censorDragStart.x, censorDragCurrent.x);
                const ry = Math.min(censorDragStart.y, censorDragCurrent.y);
                const rw = Math.abs(censorDragCurrent.x - censorDragStart.x);
                const rh = Math.abs(censorDragCurrent.y - censorDragStart.y);
                if (rw > 0.008 && rh > 0.008) { // ignore accidental clicks/micro-drags
                    getCurrentRegions().push({ x: rx, y: ry, w: rw, h: rh });

            }
            censorDragStart = null;
            censorDragCurrent = null;
            renderCensorOverlay();
        });

        if (window.ResizeObserver) {

        // --- Batch state ---
        let batchFiles = [];


        const batchProgress = document.getElementById('batchProgress');
        const batchProgressBar = document.getElementById('batchProgressBar');
        const batchProgressLabel = document.getElementById('batchProgressLabel');

        function getWatermarkParams() {
            const text = inputs.text.value;
            const fontSize = parseInt(inputs.fontSize.value) || 20;
            const fontFamily = inputs.fontFamily.value;
            const rotation = (parseInt(inputs.rotation.value) || 0) * Math.PI / 180;
            const wrapWidth = parseInt(inputs.wrapWidth.value) || 0;
            const rawGapX = parseInt(inputs.gapX.value) || 150;
            const rawGapY = parseInt(inputs.gapY.value) || 150;
            const { gapX, gapY } = getEffectiveGap(text, fontSize, fontFamily, rotation, rawGapX, rawGapY, autoFitGap.checked, wrapWidth);
            return {
                text,
                fontSize,
                opacity: parseFloat(inputs.opacity.value) || 0.5,
                color: inputs.color.value,
                rotation,
                fontFamily,
                wrapWidth,
                gapX,
                gapY,
                qualityFactor: parseFloat(webpQuality.value) / 100,
                mode: currentMode,
                format: outputFormat.value,
                grayscale: grayscale.checked,
                resizePct: parseInt(inputs.resizePct.value) || 100,
                censorBlur: parseInt(censorBlur.value) || 0
            };
        }

        async function canvasToPdfDataURL(cnv) {
            // PDF page sized exactly to the canvas (in points, 1px = 1pt - close
            // enough for a watermark export, not a print-precision document).
            const pngDataUrl = cnv.toDataURL('image/png');
            const pngBytes = new Uint8Array(await (await fetch(pngDataUrl)).arrayBuffer());
            const pdfDoc = await PDFLib.PDFDocument.create();
            const pngImage = await pdfDoc.embedPng(pngBytes);
            const page = pdfDoc.addPage([cnv.width, cnv.height]);
            page.drawImage(pngImage, { x: 0, y: 0, width: cnv.width, height: cnv.height });
            const pdfBytes = await pdfDoc.save();
            // Convert in chunks to avoid call-stack limits on large files.
            const chunkSize = 0x8000;
            let binary = '';
            for (let i = 0; i < pdfBytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, pdfBytes.subarray(i, i + chunkSize));
            }
            return 'data:application/pdf;base64,' + btoa(binary);
        }

        async function canvasToDataURL(cnv, format, qualityFactor) {
            if (format === 'application/pdf') return canvasToPdfDataURL(cnv);
            if (format === 'image/png') return cnv.toDataURL('image/png');
            const dataUrl = cnv.toDataURL(format, qualityFactor);
            // Guard: if AVIF was requested but the browser silently encoded
            // something else (every browser today does this), surface that
            // instead of shipping a file with the wrong extension.
            if (format === 'image/avif') {
                const actualMime = dataUrl.slice(5, dataUrl.indexOf(';'));
                if (actualMime !== 'image/avif') {
                    throw new Error('AVIF encoding is not supported by this browser.');
                }
            }
            return dataUrl;
        }

        async function applyWatermarkToImage(imgEl, params, regions) {
            const scale = (params.resizePct || 100) / 100;
            const offCanvas = document.createElement('canvas');
            offCanvas.width = Math.max(1, Math.round(imgEl.width * scale));
            offCanvas.height = Math.max(1, Math.round(imgEl.height * scale));
            const offCtx = offCanvas.getContext('2d');
            offCtx.filter = params.grayscale ? 'grayscale(100%)' : 'none';
            offCtx.drawImage(imgEl, 0, 0, offCanvas.width, offCanvas.height);
            offCtx.filter = 'none';
            applyCensorRegions(offCtx, imgEl, offCanvas.width, offCanvas.height, regions || [], params.censorBlur || 0, params.grayscale);
            if (params.mode === 'single') {
                drawWatermarkInstance(offCtx, offCanvas.width / 2, offCanvas.height / 2, params.text, params.fontSize, params.fontFamily, params.color, params.opacity, params.rotation, params.wrapWidth);
            } else {
                for (let x = params.gapX / 2; x < offCanvas.width + params.gapX; x += params.gapX) {
                    for (let y = params.gapY / 2; y < offCanvas.height + params.gapY; y += params.gapY) {
                        drawWatermarkInstance(offCtx, x, y, params.text, params.fontSize, params.fontFamily, params.color, params.opacity, params.rotation, params.wrapWidth);
                    }
                }
            }
            return await canvasToDataURL(offCanvas, params.format, params.qualityFactor);
        }

        function loadImageFile(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Splits text into lines that fit within maxWidth (0/falsy = no wrap,
        // returns the text as a single line). Wraps on whitespace; a single
        // word longer than maxWidth is kept on its own line rather than
        // broken mid-word.
        function wrapText(context, text, fontSize, fontFamily, maxWidth) {
            if (!maxWidth || maxWidth <= 0) return [text];
            context.font = `${fontSize}px ${fontFamily}`;
            const words = text.split(/\s+/).filter(Boolean);
            if (words.length === 0) return [text];
            const lines = [];
            let current = words[0];
            for (let i = 1; i < words.length; i++) {
                const candidate = `${current} ${words[i]}`;
                if (context.measureText(candidate).width <= maxWidth) {
                    current = candidate;
                } else {
                    lines.push(current);
                    current = words[i];
                }
            }
            lines.push(current);
            return lines;
        }

        function drawWatermarkInstance(context, x, y, text, fontSize, fontFamily, color, opacity, rotation, wrapWidth) {
            context.save();
            context.translate(x, y);
            context.rotate(rotation);
            context.font = `${fontSize}px ${fontFamily}`;
            context.fillStyle = color;
            context.globalAlpha = opacity;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            const lines = wrapText(context, text, fontSize, fontFamily, wrapWidth);
            const lineHeight = fontSize * 1.2;
            const startY = -((lines.length - 1) * lineHeight) / 2;
            lines.forEach((line, i) => {
                context.fillText(line, 0, startY + i * lineHeight);
            });
            context.restore();
        }

        // Width/height of the (possibly multi-line) text's rotated bounding
        // box - reused for single-asset canvas sizing and tiled gap auto-fit.
        function getRotatedTextBox(text, fontSize, fontFamily, rotation, wrapWidth) {
            ctx.font = `${fontSize}px ${fontFamily}`;
            const lines = wrapText(ctx, text, fontSize, fontFamily, wrapWidth);
            const lineHeight = fontSize * 1.2;
            const textWidth = Math.max(...lines.map(l => ctx.measureText(l).width));
            const textHeight = lines.length * lineHeight;
            return {
                width: Math.abs(textWidth * Math.cos(rotation)) + Math.abs(textHeight * Math.sin(rotation)),
                height: Math.abs(textWidth * Math.sin(rotation)) + Math.abs(textHeight * Math.cos(rotation))
            };
        }

        // Effective tile spacing for the watermark grid: when auto-fit is on,
        // the gap grows to fit the text (plus a margin) so longer text never
        // overlaps itself, regardless of font size or rotation. When off, the
        // gap fields are used exactly as entered (old behavior).
        function getEffectiveGap(text, fontSize, fontFamily, rotation, gapX, gapY, autoFit, wrapWidth) {
            if (!autoFit) return { gapX, gapY };
            const box = getRotatedTextBox(text, fontSize, fontFamily, rotation, wrapWidth);
            const margin = 20;
            return {
                gapX: Math.max(gapX, box.width + margin),
                gapY: Math.max(gapY, box.height + margin)
            };
        }

        function formatFileSize(bytes) {
            if (!bytes && bytes !== 0) return '';
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
            return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
        }

        function getFileTypeLabel(file) {
            if (!file) return '';
            if (file.name && file.name.includes('.')) {
                return file.name.split('.').pop().toUpperCase();
            }
            if (file.type) {
                return file.type.replace('image/', '').toUpperCase();
            }
            return '';
        }

        function getFormatBadgeClass(typeLabel) {
            switch (typeLabel) {
                case 'AVIF': return 'bg-success text-white';
                case 'WEBP': return 'bg-primary text-white';
                case 'PNG': return 'bg-warning text-dark';
                case 'JPG':
                case 'JPEG': return 'bg-amber text-dark';
                default: return 'bg-secondary text-white';
            }
        }

        function updatePreviewImageInfo() {
            if (!uploadedImage || !uploadedImage.width || !uploadedImage.height) {
                previewImageInfo.classList.add('d-none');
                previewImageInfo.classList.remove('d-flex');
                previewImageFormatBadge.textContent = '';
                previewImageInfoText.textContent = '';
                downloadCurrentBtn.classList.add('d-none');
                downloadCurrentBtn.classList.remove('d-flex');
                return;
            }
            const w = canvas.width;
            const h = canvas.height;
            const ratio = (w / h).toFixed(2);
            const isBatch = batchFiles.length > 1;
            const file = isBatch ? batchFiles[previewIdx] : uploadedFile;
            const name = isBatch
                ? (file ? file.name : '')
                : (uploadedImageName ? `${uploadedImageName}` : '');

            const typeLabel = getFileTypeLabel(file);
            previewImageFormatBadge.textContent = typeLabel;
            previewImageFormatBadge.className = `badge ${getFormatBadgeClass(typeLabel)}`;
            previewImageFormatBadge.classList.toggle('d-none', !typeLabel);

            const sizeLabel = formatFileSize(file ? file.size : null);
            const textParts = [];
            if (name) textParts.push(name);
            const resized = w !== uploadedImage.width || h !== uploadedImage.height;
            textParts.push(resized ? `${w}×${h} (${ratio}) - resized from ${uploadedImage.width}×${uploadedImage.height}` : `${w}×${h} (${ratio})`);
            if (sizeLabel) textParts.push(sizeLabel);
            previewImageInfoText.textContent = textParts.join(' - ');

            previewImageInfo.classList.remove('d-none');
            previewImageInfo.classList.add('d-flex');

            downloadCurrentBtn.classList.remove('d-none');
            downloadCurrentBtn.classList.add('d-flex');
        }

        function updateWatermark() {
            const text = inputs.text.value;
            const fontSize = parseInt(inputs.fontSize.value) || 20;
            const opacity = parseFloat(inputs.opacity.value) || 0.5;
            const color = inputs.color.value;
            const rotation = (parseInt(inputs.rotation.value) || 0) * Math.PI / 180;
            const fontFamily = inputs.fontFamily.value;
            const wrapWidth = parseInt(inputs.wrapWidth.value) || 0;
            const resizePct = uploadedImage ? (parseInt(inputs.resizePct.value) || 100) : 100;
            const scale = resizePct / 100;

            if (uploadedImage) {
                canvas.width = Math.max(1, Math.round(uploadedImage.width * scale));
                canvas.height = Math.max(1, Math.round(uploadedImage.height * scale));
            } else if (currentMode === 'single') {
                const box = getRotatedTextBox(text, fontSize, fontFamily, rotation, wrapWidth);
                const padding = 60;
                canvas.width = box.width + padding;
                canvas.height = box.height + padding;
            } else {
                canvas.width = parseInt(inputs.gridWidth.value) || 1200;
                canvas.height = parseInt(inputs.gridHeight.value) || 1600;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (uploadedImage) {
                ctx.filter = grayscale.checked ? 'grayscale(100%)' : 'none';
                ctx.drawImage(uploadedImage, 0, 0, canvas.width, canvas.height);
                ctx.filter = 'none';
                applyCensorRegions(ctx, uploadedImage, canvas.width, canvas.height, getCurrentRegions(), parseInt(censorBlur.value) || 0, grayscale.checked);
            }

            if (currentMode === 'single') {
                drawWatermarkInstance(ctx, canvas.width / 2, canvas.height / 2, text, fontSize, fontFamily, color, opacity, rotation, wrapWidth);
            } else {
                const rawGapX = parseInt(inputs.gapX.value) || 150;
                const rawGapY = parseInt(inputs.gapY.value) || 150;
                const { gapX, gapY } = getEffectiveGap(text, fontSize, fontFamily, rotation, rawGapX, rawGapY, autoFitGap.checked, wrapWidth);
                for (let x = gapX / 2; x < canvas.width + gapX; x += gapX) {
                    for (let y = gapY / 2; y < canvas.height + gapY; y += gapY) {
                        drawWatermarkInstance(ctx, x, y, text, fontSize, fontFamily, color, opacity, rotation, wrapWidth);
                    }
                }
            }

            updatePreviewImageInfo();
            syncCensorOverlay();
            renderCensorOverlay();
        }

        // --- Preview navigation ---
        let previewIdx = 0;
        const previewNav = document.getElementById('previewNav');
        const previewIndexLabel = document.getElementById('previewIndex');

        function updatePreviewNav() {
            const isBatch = batchFiles.length > 1;
            if (isBatch) {
                previewNav.classList.remove('d-none');
                previewNav.classList.add('d-flex');
                previewIndexLabel.textContent = `${previewIdx + 1} / ${batchFiles.length}`;
                document.getElementById('prevBtn').disabled = previewIdx === 0;
                document.getElementById('nextBtn').disabled = previewIdx === batchFiles.length - 1;
            } else {
                previewNav.classList.add('d-none');
                previewNav.classList.remove('d-flex');
                previewIdx = 0;
            }
        }

        function loadPreviewImage(idx) {
            if (!batchFiles[idx]) return;
            uploadedFile = batchFiles[idx];
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => { uploadedImage = img; updateWatermark(); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(batchFiles[idx]);
        }

        document.getElementById('prevBtn').addEventListener('click', () => {
            if (previewIdx > 0) { previewIdx--; loadPreviewImage(previewIdx); updatePreviewNav(); }
        });
        document.getElementById('nextBtn').addEventListener('click', () => {
            if (previewIdx < batchFiles.length - 1) { previewIdx++; loadPreviewImage(previewIdx); updatePreviewNav(); }
        });

        Object.values(inputs).forEach(input => input.addEventListener('input', () => {
            saveConfig();
            updateWatermark();
        }));

        // Init
        loadConfig();
        toggleControlsVisibility();
        updateWatermark();
    </script>
</body>
</html>
